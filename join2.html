<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a Circalune circle</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14182e; color: #f7f1e6; font-family: sans-serif; }
    main { width: min(420px, calc(100% - 32px)); text-align: center; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p { color: #d9d3ea; line-height: 1.45; }
    .code { margin: 20px 0; font-size: 34px; letter-spacing: 0.22em; font-weight: 700; }
    a, button { display: block; width: 100%; box-sizing: border-box; margin-top: 12px; padding: 14px 16px; border-radius: 999px; border: 0; background: #d7c7ff; color: #24183f; text-decoration: none; font-weight: 700; font-size: 16px; }
    button { background: transparent; color: #f7f1e6; border: 1px solid #c4b0ff; }
  </style>
</head>
<body>
  <main>
    <h1>Circalune</h1>
    <p id="lead">Tap the button to join this circle. If Circalune does not open, type the code in the app and tap Join.</p>
    <p class="code" id="code"></p>
    <a id="open" href="#">Open Circalune</a>
    <button id="alt" type="button">Try again</button>
  </main>
  <script>
    var code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    var codeNode = document.getElementById("code");
    var open = document.getElementById("open");
    var alt = document.getElementById("alt");
    if (!code) {
      codeNode.textContent = "NO CODE";
      document.getElementById("lead").textContent = "Ask them to send the invite again.";
      open.style.display = "none";
      alt.style.display = "none";
    } else {
      codeNode.textContent = code;
      var app = "circalune://join/" + code;
      var intent = "intent://join/" + code + "#Intent;scheme=circalune;package=app.circalune;end";
      open.href = app;
      open.textContent = "Open Circalune and join " + code;
      alt.textContent = "Open another way";
      alt.onclick = function () { location.href = intent; };
    }
  </script>
</body>
</html>
